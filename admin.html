<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="images/Hostellerie logo.png">
  <title>Tableau de bord | Hostellerie de la Sanaga</title>
  <style>
    :root {
      --navy: #1a1f36;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.14);
      --bg: #f4f5f8;
      --surface: #ffffff;
      --surface-2: #f8f9fb;
      --text: #1a1f36;
      --text-2: #4b5168;
      --muted: #6f7590;
      --border: #e6e8ef;
      --grid: #eef0f4;
      --qr: #3f51b5;
      --links: #b8860b;
      --hover-ring: rgba(26, 31, 54, 0.12);
      --good: #15803d;
      --good-bg: #e8f6ee;
      --bad: #b91c1c;
      --bad-bg: #fdecec;
      --shadow: 0 1px 2px rgba(26, 31, 54, 0.04), 0 4px 16px rgba(26, 31, 54, 0.05);
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1222;
        --surface: #171b30;
        --surface-2: #1d2238;
        --text: #eef0f7;
        --text-2: #c3c7d8;
        --muted: #8c92ab;
        --border: #2a2f49;
        --grid: #242943;
        --qr: #6373e0;
        --links: #b8860b;
        --hover-ring: rgba(255, 255, 255, 0.08);
        --good: #4ade80;
        --good-bg: rgba(74, 222, 128, 0.12);
        --bad: #f87171;
        --bad-bg: rgba(248, 113, 113, 0.12);
        --shadow: none;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    /* ---------- Login ---------- */
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.18), transparent 40%),
        linear-gradient(135deg, #1a1f36 0%, #2d3561 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border-radius: 18px;
      padding: 36px 32px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .login-card img { width: 72px; height: 72px; object-fit: contain; margin: 0 auto 12px; }
    .login-card h1 { font-size: 1.35rem; color: var(--text); }
    .login-card .subtitle { color: var(--muted); font-size: 0.92rem; margin: 4px 0 26px; }
    .field { text-align: left; margin-bottom: 16px; }
    .field label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
    .password-wrap { position: relative; }
    .field input {
      width: 100%;
      font: inherit;
      padding: 12px 52px 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
    .toggle-pw {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); font-size: 0.8rem; padding: 6px 8px;
    }
    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      background: var(--gold);
      color: #1a1f36;
      font-weight: 700;
      transition: filter 0.15s;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:disabled { opacity: 0.7; cursor: wait; }
    .login-error { color: var(--bad); font-size: 0.88rem; margin-top: 12px; min-height: 1.2em; }
    .login-foot { margin-top: 18px; font-size: 0.8rem; color: var(--muted); }

    /* ---------- App layout ---------- */
    .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      background: var(--navy);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .brand img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 10px; padding: 3px; }
    .brand strong { display: block; font-size: 0.95rem; line-height: 1.2; }
    .brand span { font-size: 0.75rem; color: var(--gold); letter-spacing: 0.04em; text-transform: uppercase; }
    .nav { margin-top: 18px; display: flex; flex-direction: column; gap: 4px; }
    .nav-title { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.4); padding: 10px 12px 4px; }
    .nav a {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      text-decoration: none; color: rgba(255,255,255,0.72); font-size: 0.92rem;
    }
    .nav a:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .nav a.active { background: rgba(212,175,55,0.16); color: var(--gold); font-weight: 600; }
    .nav svg { width: 18px; height: 18px; flex-shrink: 0; }
    .account {
      margin-top: auto;
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
      padding: 16px 8px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--gold); color: var(--navy);
      display: grid; place-items: center; font-weight: 700; flex-shrink: 0;
    }
    .account-info { min-width: 0; flex: 1; }
    .account-info strong { display: block; font-size: 0.9rem; }
    .account-info span { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
    .logout {
      flex-basis: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.85);
      border-radius: 9px; padding: 8px 10px; font-size: 0.85rem;
    }
    .logout svg { width: 16px; height: 16px; }
    .logout:hover { border-color: var(--gold); color: var(--gold); }

    .main { padding: 28px 32px 48px; min-width: 0; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .topbar h2 { font-size: 1.5rem; }
    .topbar p { color: var(--muted); font-size: 0.92rem; margin-top: 2px; }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .updated { color: var(--muted); font-size: 0.82rem; }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 14px; font-size: 0.88rem; font-weight: 600;
    }
    .btn-ghost:hover { border-color: var(--gold); }
    .btn-ghost svg { width: 16px; height: 16px; }
    .btn-ghost.loading svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .section-label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .swatch.qr { background: var(--qr); }
    .swatch.links { background: var(--links); }
    .swatch.all { background: linear-gradient(135deg, var(--qr) 50%, var(--links) 50%); }

    /* Channel switcher: the three sections */
    .channels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
    .channel {
      text-align: left; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
      position: relative; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .channel:hover { border-color: var(--muted); }
    .channel.active { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft), var(--shadow); }
    .channel .head { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: 700; color: var(--text-2); }
    .channel .icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
    .channel .icon svg { width: 17px; height: 17px; }
    .channel.active .icon { background: var(--gold-soft); color: var(--gold); }
    .channel .value { font-size: 1.9rem; font-weight: 700; margin-top: 10px; font-variant-numeric: tabular-nums; }
    .channel .meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .channel .share-line { height: 4px; border-radius: 2px; background: var(--grid); margin-top: 12px; overflow: hidden; }
    .channel .share-line div { height: 100%; border-radius: 2px; }

    /* Rolling totals strip */
    .rolling { display: grid; grid-template-columns: repeat(5, 1fr); margin-bottom: 24px; }
    .rolling div { padding: 16px 18px; border-left: 1px solid var(--border); }
    .rolling div:first-child { border-left: none; }
    .rolling span { display: block; font-size: 0.8rem; color: var(--muted); }
    .rolling strong { display: block; font-size: 1.35rem; margin-top: 4px; font-variant-numeric: tabular-nums; }

    /* Period controls */
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .segmented { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .segmented button {
      border: none; background: none; color: var(--text-2);
      padding: 7px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600;
    }
    .segmented button.active { background: var(--navy); color: #fff; }
    @media (prefers-color-scheme: dark) { .segmented button.active { background: var(--gold); color: var(--navy); } }
    .stepper { display: inline-flex; align-items: center; gap: 6px; }
    .stepper .arrow {
      width: 34px; height: 34px; display: grid; place-items: center; padding: 0;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: 9px;
    }
    .stepper .arrow svg { width: 16px; height: 16px; }
    .stepper .arrow:hover:not(:disabled) { border-color: var(--gold); }
    .stepper .arrow:disabled { opacity: 0.35; cursor: default; }
    .stepper .period-label { min-width: 170px; text-align: center; font-weight: 700; }
    .stepper .today-btn { border: none; background: none; color: var(--gold); font-weight: 700; font-size: 0.85rem; padding: 6px 8px; }

    /* KPI cards */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
    .kpi { padding: 18px 20px; }
    .kpi .label { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
    .kpi .value { font-size: 2rem; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .kpi .sub { font-size: 0.8rem; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 0.78rem; padding: 2px 7px; border-radius: 999px; }
    .badge.up { color: var(--good); background: var(--good-bg); }
    .badge.down { color: var(--bad); background: var(--bad-bg); }
    .badge.flat { color: var(--muted); background: var(--surface-2); }

    /* Chart */
    .chart-panel { padding: 20px 20px 14px; margin-bottom: 16px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .panel-head h3 { font-size: 1rem; }
    .panel-head .hint { font-size: 0.82rem; color: var(--muted); }
    .legend { display: flex; gap: 16px; font-size: 0.82rem; color: var(--text-2); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .chart { position: relative; display: grid; grid-template-columns: 40px 1fr; grid-template-rows: 1fr 26px; height: 290px; }
    .y-axis { position: relative; }
    .y-axis span { position: absolute; right: 8px; transform: translateY(50%); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .plot { position: relative; border-bottom: 1px solid var(--border); }
    .gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); }
    .bars { position: absolute; inset: 0; display: flex; align-items: stretch; gap: 2px; }
    .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; border-radius: 6px 6px 0 0; outline: none; }
    .col:hover, .col:focus-visible { background: var(--hover-ring); }
    .stack { width: 100%; max-width: 44px; display: flex; flex-direction: column-reverse; gap: 2px; }
    .seg { width: 100%; }
    .seg.qr { background: var(--qr); }
    .seg.links { background: var(--links); }
    .stack .seg:last-child { border-radius: 4px 4px 0 0; }
    .x-axis { grid-column: 2; display: flex; gap: 2px; padding-top: 8px; }
    .x-axis span { flex: 1; text-align: center; font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: visible; min-width: 0; }
    .tooltip {
      position: absolute; pointer-events: none; z-index: 5;
      background: var(--navy); color: #fff; border-radius: 8px;
      padding: 8px 10px; font-size: 0.8rem; white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      transform: translate(-50%, calc(-100% - 10px));
      border: 1px solid rgba(255,255,255,0.1);
    }
    .tooltip .tt-title { color: rgba(255,255,255,0.7); }
    .tooltip strong { display: block; font-size: 1rem; }
    .tooltip .tt-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .tooltip .tt-row b { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
    .empty-note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 0.9rem; pointer-events: none; }

    /* Analysis panels */
    .insights { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .insights .wide { grid-column: 1 / -1; }
    .list-panel { padding: 20px; }
    .list-row { display: grid; grid-template-columns: minmax(170px, 1.3fr) 2fr auto; align-items: center; gap: 12px; padding: 7px 0; font-size: 0.9rem; }
    .list-row .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .list-row .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-row .track { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
    .list-row .fill { height: 100%; border-radius: 4px; }
    .list-row .num { font-variant-numeric: tabular-nums; text-align: right; min-width: 78px; }
    .list-row .num small { color: var(--muted); margin-left: 6px; }
    .list-row.top .name { font-weight: 700; }
    .list-empty { color: var(--muted); font-size: 0.9rem; padding: 6px 0; }
    .info-panel { padding: 20px; font-size: 0.9rem; color: var(--text-2); line-height: 1.55; }
    .info-panel h3 { font-size: 1rem; color: var(--text); margin-bottom: 8px; }
    .info-panel p + p { margin-top: 8px; }
    .info-panel code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: 0.85em; }

    /* Breakdown table */
    .table-panel { padding: 8px 20px 12px; }
    .table-panel h3 { font-size: 1rem; padding: 12px 0 6px; }
    .table-scroll { max-height: 440px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 10px 4px; border-bottom: 1px solid var(--border); text-align: left; }
    thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
    tr:last-child td { border-bottom: none; }
    th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    th .th-inner { display: inline-flex; align-items: center; gap: 6px; }
    td.total { font-weight: 700; }
    td.muted { color: var(--muted); }

    .footnote { color: var(--muted); font-size: 0.8rem; margin-top: 18px; line-height: 1.5; }
    .error-banner { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 0.9rem; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 860px) {
      .app { grid-template-columns: minmax(0, 1fr); }
      .sidebar { position: static; height: auto; flex-direction: row; align-items: center; padding: 12px 16px; gap: 12px; }
      .brand { border: none; padding: 0; flex: 1; min-width: 0; }
      .brand span { display: none; }
      .nav { display: none; }
      .account { margin: 0; padding: 0; border: none; flex-wrap: nowrap; }
      .account-info { display: none; }
      .logout { flex-basis: auto; padding: 6px 10px; }
      .main { padding: 20px 16px 40px; }
      .insights { grid-template-columns: 1fr; }
      .rolling { grid-template-columns: repeat(3, 1fr); }
      .rolling div:nth-child(4) { border-left: none; }
      .rolling div:nth-child(n+4) { border-top: 1px solid var(--border); }
    }
    @media (max-width: 560px) {
      .channels { grid-template-columns: 1fr; gap: 10px; }
      .channel { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 12px 14px; }
      .channel .value { margin: 0; font-size: 1.4rem; grid-row: span 2; }
      .channel .meta { grid-column: 1; }
      .channel .share-line { display: none; }
      .rolling { grid-template-columns: repeat(2, 1fr); }
      .rolling div { border-left: none !important; border-top: 1px solid var(--border); }
      .rolling div:nth-child(-n+2) { border-top: none; }
      .rolling div:nth-child(even) { border-left: 1px solid var(--border) !important; }
      .rolling div:last-child { grid-column: span 2; border-left: none !important; }
      .kpis { gap: 10px; }
      .kpi { padding: 14px; }
      .kpi .value { font-size: 1.5rem; }
      .segmented { width: 100%; }
      .segmented button { flex: 1; padding: 7px 4px; font-size: 0.8rem; }
      .stepper { width: 100%; justify-content: space-between; }
      .stepper .period-label { min-width: 0; flex: 1; font-size: 0.92rem; }
      .chart { height: 220px; grid-template-columns: 32px 1fr; }
      .list-row { grid-template-columns: 1fr auto; }
      .list-row .track { grid-column: 1 / -1; grid-row: 2; }
      th, td { padding: 9px 3px; font-size: 0.82rem; }
    }
    /* Language switch */
    .lang-switch { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
    .lang-switch button { border: none; background: none; color: var(--muted); font-size: 0.78rem; font-weight: 700; padding: 5px 9px; border-radius: 7px; letter-spacing: 0.04em; }
    .lang-switch button.active { background: var(--navy); color: #fff; }
    @media (prefers-color-scheme: dark) { .lang-switch button.active { background: var(--gold); color: var(--navy); } }
    .login-card { position: relative; }
    .login-card .lang-switch { position: absolute; top: 14px; right: 14px; }
    @media (max-width: 560px) {
      .topbar-actions { width: 100%; flex-wrap: wrap; }
      .topbar-actions .lang-switch { margin-left: auto; }
    }
  </style>
</head>
<body>
  <!-- ---------- Login ---------- -->
  <div class="login-page" id="login-page">
    <form class="login-card" id="login-form">
      <div class="lang-switch" data-lang-switch>
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <img src="images/Hostellerie logo.png" alt="Hostellerie de la Sanaga">
      <h1 data-i18n="loginTitle"></h1>
      <p class="subtitle" data-i18n="loginSubtitle"></p>
      <div class="field">
        <label for="password" data-i18n="password"></label>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="current-password" required autofocus>
          <button type="button" class="toggle-pw" id="toggle-pw" data-i18n="show"></button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="login-btn" data-i18n="signIn"></button>
      <p class="login-error" id="login-error" role="alert"></p>
      <p class="login-foot" data-i18n="loginFoot"></p>
    </form>
  </div>

  <!-- ---------- Dashboard ---------- -->
  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <img src="images/Hostellerie logo.png" alt="">
        <div>
          <strong>Hostellerie de la Sanaga</strong>
          <span>Admin</span>
        </div>
      </div>
      <nav class="nav" id="side-nav">
        <div class="nav-title" data-i18n="navAnalytics"></div>
        <a href="#" data-channel="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
          <span data-i18n="chAll"></span>
        </a>
        <a href="#" data-channel="qr">

        breakdown: 'Breakdown',
        unit: { day: 'Day', week: 'Week', month: 'Month' },
        colVisits: 'Visits', colScans: 'Scans', colShare: 'Share', colTotal: 'Total',
        months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
        monthsShort: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
        weekdays: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
        weekdaysShort: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
        sources: { google: 'Google', search: 'Other search engines', facebook: 'Facebook', instagram: 'Instagram', tiktok: 'TikTok', whatsapp: 'WhatsApp', social: 'Other social media', website: 'Other websites', direct: 'Shared links & bookmarks' },

    const SOURCE_KEYS = ['google', 'search', 'facebook', 'instagram', 'tiktok', 'whatsapp', 'social', 'website', 'direct'];
    const PAGE_KEYS = ['home', 'menu', 'hotel', 'mariage', 'gateau'];

    let lang = 'fr';
    const L = () => I18N[lang];
    function t(key, vars) {
      let text = L()[key];
      if (vars) for (const k in vars) text = text.replace('{' + k + '}', vars[k]);
      return text;
    }
    const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);

    const state = { days: {}, today: 0, earliest: 0, mode: 'month', anchor: 0, channel: 'all' };
    let password = '';

    const $ = id => document.getElementById(id);
    const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

    // ---------- Formatting ----------
    function parseISO(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); }
    function toISO(t) { return new Date(t).toISOString().slice(0, 10); }
    function parts(t) { const d = new Date(t); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), wd: d.getUTCDay() }; }
    function monthStart(y, m) { return Date.UTC(y, m, 1); }
    function fmtDay(t, withYear) {
      const p = parts(t);
      return `${p.d} ${L().monthsShort[p.m]}${withYear ? ' ' + p.y : ''}`;
    }
    function fmtWeekday(t) { return capitalize(L().weekdaysShort[parts(t).wd]); }
    function fmtNum(n) { return Math.round(n).toLocaleString(L().locale); }
    function pct(part, whole) { return whole ? Math.round((part / whole) * 100) : 0; }
    function fmtPct(n) { return lang === 'fr' ? `${n} %` : `${n}%`; }
    function noun(n, channel = state.channel) {
      return channel === 'qr' ? t(n === 1 ? 'scan' : 'scans') : t(n === 1 ? 'visit' : 'visits');
    }

    // ---------- Reading the data ----------
    function sumValues(obj) { let s = 0; for (const k in obj) s += obj[k]; return s; }

    function countOn(t, channel = state.channel) {
      const day = state.days[toISO(t)];
      if (!day) return 0;
      const qr = day.s.qr || 0;
      if (channel === 'qr') return qr;
      const total = sumValues(day.s);
      return channel === 'links' ? total - qr : total;
    }

    function sumRange(start, end, channel = state.channel) {
      let total = 0;
      for (let t = start; t <= end; t += DAY) total += countOn(t, channel);
      return total;
    }

    // Totals per source or per landing page between two dates, for the current section
    function tally(start, end, kind) {
      const out = {};
      const add = (key, n) => { if (n) out[key] = (out[key] || 0) + n; };
      for (let t = start; t <= end; t += DAY) {
        const day = state.days[toISO(t)];
        if (!day) continue;
        if (kind === 'sources') {
          for (const k in day.s) if (k !== 'qr') add(k, day.s[k]);
        } else if (state.channel === 'all') {
          for (const k in day.p) add(k, day.p[k]);
        } else if (state.channel === 'links') {
          for (const k in day.l) add(k, day.l[k]);
        } else {
          for (const k in day.p) add(k, day.p[k] - ((day.l && day.l[k]) || 0));
        }
      }
      return out;
    }

    // ---------- Periods ----------
    const SPANS = { month: 1, quarter: 3, half: 6, year: 12 };

    function periodFor(mode, anchor) {
      const p = parts(anchor);
      if (mode === 'week') {
        const start = anchor - ((p.wd + 6) % 7) * DAY; // Monday
        return { start, end: start + 6 * DAY };
      }
      const span = SPANS[mode];
      const firstMonth = Math.floor(p.m / span) * span;
      return { start: monthStart(p.y, firstMonth), end: monthStart(p.y, firstMonth + span) - DAY };
    }

    function shiftAnchor(mode, anchor, dir) {
      if (mode === 'week') return anchor + dir * 7 * DAY;
      const p = parts(periodFor(mode, anchor).start);
      return monthStart(p.y, p.m + dir * SPANS[mode]);
    }

    function periodLabel(mode, { start, end }) {
      const s = parts(start), e = parts(end);
      switch (mode) {
        case 'week': return `${fmtDay(start, s.y !== e.y)} – ${fmtDay(end, true)}`;
        case 'month': return `${capitalize(L().months[s.m])} ${s.y}`;
        case 'year': return String(s.y);
        default: return `${capitalize(L().monthsShort[s.m])} – ${L().monthsShort[e.m]} ${s.y}`;
      }
    }

    // Split a period into the bars of the chart
    function bucketsFor(mode, { start, end }) {
      const buckets = [];
      if (mode === 'week' || mode === 'month') {
        for (let t = start; t <= end; t += DAY) {
          buckets.push({ start: t, end: t, axis: mode === 'week' ? fmtWeekday(t) : String(parts(t).d), name: `${fmtWeekday(t)} ${fmtDay(t, true)}` });
        }
      } else if (mode === 'year') {
        const y = parts(start).y;
        for (let m = 0; m < 12; m++) {
          buckets.push({ start: monthStart(y, m), end: monthStart(y, m + 1) - DAY, axis: capitalize(L().monthsShort[m]), name: `${capitalize(L().months[m])} ${y}` });
        }
      } else {
        // 3 / 6 months: one bar per week (Monday–Sunday, clipped to the period)
        let s = start;
        while (s <= end) {
          const e = Math.min(end, s + ((7 - parts(s).wd) % 7) * DAY);
          buckets.push({ start: s, end: e, axis: fmtDay(s), name: `${fmtDay(s)} – ${fmtDay(e, true)}` });
          s = e + DAY;
        }
      }
      buckets.forEach(b => {
        b.future = b.start > state.today;
        const last = Math.min(b.end, state.today);
        b.qr = b.future ? 0 : sumRange(b.start, last, 'qr');
        b.links = b.future ? 0 : sumRange(b.start, last, 'links');
        b.count = state.channel === 'qr' ? b.qr : state.channel === 'links' ? b.links : b.qr + b.links;
      });
      return buckets;
    }

    // ---------- Rendering ----------
    function applyStaticText() {
      document.documentElement.lang = lang;
      document.title = t('pageTitle');
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      $('toggle-pw').textContent = t($('password').type === 'password' ? 'show' : 'hide');
      $('prev').setAttribute('aria-label', t('prevPeriod'));
      $('next').setAttribute('aria-label', t('nextPeriod'));
    }

    function changeBadge(current, previous) {
      if (previous === 0 && current === 0) return `<span class="badge flat">${fmtPct(0)}</span>`;
      if (previous === 0) return `<span class="badge up">▲ ${t('badgeNew')}</span>`;
      const change = ((current - previous) / previous) * 100;
      if (Math.abs(change) < 0.5) return `<span class="badge flat">${fmtPct(0)}</span>`;
      const value = Math.abs(change).toLocaleString(L().locale, { maximumFractionDigits: Math.abs(change) < 10 ? 1 : 0 });
      return `<span class="badge ${change > 0 ? 'up' : 'down'}">${change > 0 ? '▲' : '▼'} ${fmtPct(value)}</span>`;
    }

    // Top of the y-axis: 4 gridlines with round, whole-number steps, always above the tallest bar
    function niceMax(value) {
      const raw = Math.max(1, value * 1.08 / 4);
      const pow = Math.pow(10, Math.floor(Math.log10(raw)));
      for (const step of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) {
        const tick = step * pow;
        if (tick >= raw && Number.isInteger(tick)) return tick * 4;
      }
      return Math.ceil(raw) * 4;
    }

    function renderSectionChrome() {
      const key = { all: 'All', qr: 'Qr', links: 'Links' }[state.channel];
      $('page-title').textContent = t('ch' + key);
      $('page-subtitle').textContent = t('sub' + key);
      $('footnote').textContent = t('foot' + key);
      $('kpi-total-label').textContent = t(state.channel === 'qr' ? 'kpiTotalScans' : 'kpiTotalVisits');
      document.querySelectorAll('[data-channel]').forEach(el => el.classList.toggle('active', el.dataset.channel === state.channel));
    }

    function renderChannels(period, elapsedEnd, elapsedDays) {
      const totals = {
        qr: elapsedDays ? sumRange(period.start, elapsedEnd, 'qr') : 0,
        links: elapsedDays ? sumRange(period.start, elapsedEnd, 'links') : 0
      };
      totals.all = totals.qr + totals.links;
      document.querySelectorAll('.channel').forEach(card => {
        const key = card.dataset.channel;
        card.querySelector('[data-value]').textContent = fmtNum(totals[key]);
        card.querySelector('[data-meta]').textContent = key === 'all'
          ? t('periodMeta', { period: periodLabel(state.mode, period) })
          : t('shareOfAll', { pct: fmtPct(pct(totals[key], totals.all)) });
        const share = card.querySelector('[data-share]');
        if (share) share.style.width = pct(totals[key], totals.all) + '%';
      });
    }

    function renderRolling() {
      const lengths = [7, 30, 90, 182, 365];
      $('rolling').innerHTML = lengths.map((days, i) =>
        `<div><span>${L().rollingItems[i]}</span><strong>${fmtNum(sumRange(state.today - (days - 1) * DAY, state.today))}</strong></div>`
      ).join('');
    }

    function renderChart(mode, buckets) {
      const channel = state.channel;
      const max = niceMax(Math.max(0, ...buckets.map(b => b.count)));
      const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => f * max);
      const h = n => (n / max) * 100;
      const ct = L().chartTitle;

      $('chart-title').textContent = `${channel === 'qr' ? ct.scans : ct.visits} ${ct[{ week: 'day', month: 'day', quarter: 'week', half: 'week', year: 'month' }[mode]]}`;
      $('legend').innerHTML = channel === 'all'
        ? `<span><i class="swatch qr"></i>${escapeHtml(t('chQr'))}</span><span><i class="swatch links"></i>${escapeHtml(t('chLinks'))}</span>`
        : `<span><i class="swatch ${channel}"></i>${escapeHtml(t(channel === 'qr' ? 'chQr' : 'chLinks'))}</span>`;

      $('y-axis').innerHTML = ticks.map(v => `<span style="bottom:${h(v)}%">${fmtNum(v)}</span>`).join('');

      const grid = ticks.slice(1).map(v => `<div class="gridline" style="bottom:${h(v)}%"></div>`).join('');
      const cols = buckets.map((b, i) => {
        const segs = [];
        if (channel !== 'links' && b.qr) segs.push(`<div class="seg qr" style="height:${h(b.qr)}%"></div>`);
        if (channel !== 'qr' && b.links) segs.push(`<div class="seg links" style="height:${h(b.links)}%"></div>`);
        return `<div class="col" data-i="${i}" tabindex="0" aria-label="${b.name}: ${b.future ? t('upcoming') : fmtNum(b.count) + ' ' + noun(b.count)}">
          <div class="stack" style="height:100%">${segs.join('')}</div>
        </div>`;
      }).join('');
      const empty = buckets.every(b => b.count === 0);
      $('plot').innerHTML = grid + `<div class="bars">${cols}</div>` +
        (empty ? `<div class="empty-note">${t('nothing')}</div>` : '') +
        '<div class="tooltip" id="tooltip" hidden></div>';

      // Label only every n-th bar so the labels never collide
      const plotWidth = $('plot').clientWidth || 600;
      const labelWidth = mode === 'quarter' || mode === 'half' ? 52 : mode === 'week' ? 36 : 26;
      const every = Math.max(1, Math.ceil(buckets.length / Math.floor(plotWidth / labelWidth)));
      $('x-axis').innerHTML = buckets.map((b, i) => `<span>${i % every === 0 ? b.axis : ''}</span>`).join('');

      const tooltip = $('tooltip');
      $('plot').querySelectorAll('.col').forEach(col => {
        const show = () => {
          const b = buckets[col.dataset.i];
          let html = `<div class="tt-title">${b.name}</div>`;
          if (b.future) html += `<strong>${t('upcoming')}</strong>`;
          else {
            html += `<strong>${fmtNum(b.count)} ${noun(b.count)}</strong>`;
            if (channel === 'all') {
              html += `<div class="tt-row"><i class="swatch qr"></i>${escapeHtml(t('chQr'))}<b>${fmtNum(b.qr)}</b></div>` +
                      `<div class="tt-row"><i class="swatch links"></i>${escapeHtml(t('chLinks'))}<b>${fmtNum(b.links)}</b></div>`;
            }
          }
          tooltip.innerHTML = html;
          tooltip.hidden = false;
          const plotRect = $('plot').getBoundingClientRect();
          const colRect = col.getBoundingClientRect();
          const segTop = col.querySelector('.seg:last-child');
          const top = segTop ? segTop.getBoundingClientRect().top - plotRect.top : plotRect.height;
          const half = tooltip.offsetWidth / 2;
          const x = Math.min(Math.max(colRect.left + colRect.width / 2 - plotRect.left, half), plotRect.width - half);
          tooltip.style.left = x + 'px';
          tooltip.style.top = Math.max(Math.min(top, plotRect.height - 4), tooltip.offsetHeight + 10) + 'px';
        };
        col.addEventListener('mouseenter', show);
        col.addEventListener('focus', show);
        col.addEventListener('mouseleave', () => { tooltip.hidden = true; });
        col.addEventListener('blur', () => { tooltip.hidden = true; });
      });
    }

    // A ranked list with bars, used for sources, pages, weekdays and channels
    function listPanel(title, hint, rows, options = {}) {
      const total = rows.reduce((s, r) => s + r.value, 0);
      const max = Math.max(1, ...rows.map(r => r.value));
      const best = Math.max(...rows.map(r => r.value));
      const body = total
        ? rows.map(r => `
            <div class="list-row${options.highlightTop && r.value === best ? ' top' : ''}">
              <div class="name">${r.swatch ? `<i class="swatch ${r.swatch}"></i>` : ''}<span>${escapeHtml(r.label)}</span></div>
              <div class="track"><div class="fill" style="width:${(r.value / max) * 100}%; background:${r.color || `var(--${state.channel === 'all' ? 'qr' : state.channel})`}"></div></div>
              <div class="num">${fmtNum(r.value)}<small>${fmtPct(pct(r.value, total))}</small></div>
            </div>`).join('')
        : `<p class="list-empty">${t('nothingYet')}</p>`;
      return `<div class="panel list-panel${options.wide ? ' wide' : ''}">
        <div class="panel-head"><h3>${escapeHtml(title)}</h3><span class="hint">${hint}</span></div>
        ${body}
      </div>`;
    }

    function renderInsights(period, elapsedEnd, elapsedDays) {
      const label = periodLabel(state.mode, period);
      const panels = [];
      const range = elapsedDays ? [period.start, elapsedEnd] : null;

      const pageRows = () => {
        const pages = range ? tally(range[0], range[1], 'pages') : {};
        return PAGE_KEYS.map(k => ({ label: L().pages[k], value: pages[k] || 0 })).sort((a, b) => b.value - a.value);
      };
      const weekdayRows = () => {
        const counts = [0, 0, 0, 0, 0, 0, 0];
        if (range) for (let d = range[0]; d <= range[1]; d += DAY) counts[parts(d).wd] += countOn(d);
        return [1, 2, 3, 4, 5, 6, 0].map(wd => ({ label: capitalize(L().weekdays[wd]), value: counts[wd] }));
      };

      if (state.channel === 'all') {
        const qr = range ? sumRange(range[0], range[1], 'qr') : 0;
        const links = range ? sumRange(range[0], range[1], 'links') : 0;
        panels.push(listPanel(t('whereFrom'), label, [
          { label: t('chQr'), value: qr, swatch: 'qr', color: 'var(--qr)' },
          { label: t('chLinks'), value: links, swatch: 'links', color: 'var(--links)' }
        ]));
        panels.push(listPanel(t('pagesFirst'), label, pageRows(), { highlightTop: true }));
        panels.push(listPanel(t('busiestDays'), label, weekdayRows(), { wide: true, highlightTop: true }));
      } else if (state.channel === 'links') {
        const sources = range ? tally(range[0], range[1], 'sources') : {};
        const rows = SOURCE_KEYS.map(k => ({ label: L().sources[k], value: sources[k] || 0 }))
          .filter(r => r.value > 0).sort((a, b) => b.value - a.value);
        panels.push(listPanel(t('topSources'), label, rows.length ? rows : [{ label: 'Google', value: 0 }], { highlightTop: true }));
        panels.push(listPanel(t('pagesFirst'), label, pageRows(), { highlightTop: true }));
        panels.push(listPanel(t('busiestDays'), label, weekdayRows(), { wide: true, highlightTop: true }));
      } else {
        panels.push(listPanel(t('busiestDays'), label, weekdayRows(), { highlightTop: true }));
        panels.push(`<div class="panel info-panel">
          <h3>${t('howCountedTitle')}</h3>
          <p>${t('howCounted1')}</p>
          <p>${t('howCounted2')}</p>
        </div>`);
      }
      $('insights').innerHTML = panels.join('');
    }

    function renderBreakdown(mode, buckets, total) {
      const unit = L().unit[{ week: 'day', month: 'day', quarter: 'week', half: 'week', year: 'month' }[mode]];
      const rows = buckets.filter(b => !b.future).reverse();
      if (state.channel === 'all') {
        $('breakdown-head').innerHTML = `<tr><th>${unit}</th>
          <th class="num"><span class="th-inner"><i class="swatch qr"></i>${escapeHtml(t('chQr'))}</span></th>
          <th class="num"><span class="th-inner"><i class="swatch links"></i>${escapeHtml(t('chLinks'))}</span></th>
          <th class="num">${t('colTotal')}</th></tr>`;
        $('breakdown').innerHTML = rows.length ? rows.map(b => `<tr>
          <td>${b.name}</td><td class="num">${fmtNum(b.qr)}</td><td class="num">${fmtNum(b.links)}</td><td class="num total">${fmtNum(b.count)}</td>
        </tr>`).join('') : `<tr><td colspan="4" class="muted">${t('notStarted')}</td></tr>`;
      } else {
        $('breakdown-head').innerHTML = `<tr><th>${unit}</th><th class="num">${t(state.channel === 'qr' ? 'colScans' : 'colVisits')}</th><th class="num">${t('colShare')}</th></tr>`;
        $('breakdown').innerHTML = rows.length ? rows.map(b => `<tr>
          <td>${b.name}</td><td class="num">${fmtNum(b.count)}</td><td class="num">${fmtPct(pct(b.count, total))}</td>
        </tr>`).join('') : `<tr><td colspan="3" class="muted">${t('notStarted')}</td></tr>`;
      }
    }

    function render() {
      const { mode } = state;
      const period = periodFor(mode, state.anchor);
      const elapsedEnd = Math.min(period.end, state.today);
      const elapsedDays = Math.max(0, Math.round((elapsedEnd - period.start) / DAY) + 1);
      const isCurrent = period.start <= state.today && state.today <= period.end;

      renderSectionChrome();
      document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      $('period-label').textContent = periodLabel(mode, period);
      $('next').disabled = period.end >= state.today;
      $('prev').disabled = period.start <= state.earliest;
      $('today-btn').hidden = isCurrent;

      renderChannels(period, elapsedEnd, elapsedDays);

      // Compare with the same stretch of the previous period
      const total = elapsedDays ? sumRange(period.start, elapsedEnd) : 0;
      const prev = periodFor(mode, shiftAnchor(mode, state.anchor, -1));
      const prevEnd = Math.min(prev.end, prev.start + (elapsedDays - 1) * DAY);
      const prevTotal = elapsedDays ? sumRange(prev.start, prevEnd) : 0;
      $('kpi-total').textContent = fmtNum(total);
      $('kpi-change').innerHTML = `${changeBadge(total, prevTotal)} ${(isCurrent ? L().vsSame : L().vsPrev)[mode]} (${fmtNum(prevTotal)})`;

      const avg = elapsedDays ? total / elapsedDays : 0;
      $('kpi-avg').textContent = avg < 10 ? avg.toLocaleString(L().locale, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : fmtNum(avg);
      $('kpi-avg-sub').textContent = t('perDayOver', { noun: noun(2), n: elapsedDays, days: t(elapsedDays === 1 ? 'day' : 'days') });

      let best = null;
      for (let d = period.start; d <= elapsedEnd; d += DAY) {
        const c = countOn(d);
        if (c > 0 && (!best || c > best.count)) best = { d, count: c };
      }
      $('kpi-best').textContent = best ? fmtNum(best.count) : '–';
      $('kpi-best-sub').textContent = best ? `${fmtWeekday(best.d)} ${fmtDay(best.d, true)}` : t('nothing');

      const todayCount = countOn(state.today);
      const yesterdayCount = countOn(state.today - DAY);
      $('kpi-today').textContent = fmtNum(todayCount);
      $('kpi-today-sub').innerHTML = `${changeBadge(todayCount, yesterdayCount)} ${t('vsYesterday')} (${fmtNum(yesterdayCount)})`;

      const buckets = bucketsFor(mode, period);
      renderChart(mode, buckets);
      renderInsights(period, elapsedEnd, elapsedDays);
      renderRolling();
      renderBreakdown(mode, buckets, total);
      renderUpdated();
    }

    let lastUpdated = null;
    function renderUpdated() {
      $('updated').textContent = lastUpdated
        ? t('updated', { time: lastUpdated.toLocaleTimeString(L().locale, { hour: '2-digit', minute: '2-digit' }) })
        : '';
    }

    function setLanguage(next) {
      lang = I18N[next] ? next : 'fr';
      try { localStorage.setItem('siteLanguage', lang); } catch (err) {}
      applyStaticText();
      if (!$('app').hidden) render();
    }

    // ---------- Data & sign-in ----------
    function savePassword(value) {
      try {
        if (value) sessionStorage.setItem('adminPassword', value);
        else sessionStorage.removeItem('adminPassword');
      } catch (err) {}
    }

    async function loadStats() {
      const response = await fetch('/api/stats', { headers: { 'x-admin-password': password } });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const err = new Error(data.error || '');
        err.status = response.status;
        throw err;
      }
      state.days = data.days || {};
      state.earliest = parseISO(data.start);
      const today = parseISO(data.today);
      if (!state.today) state.anchor = today;
      state.today = today;
      lastUpdated = new Date();
    }

    // Our own message, plus the server's detail when there is one (e.g. a missing setting)
    function errorText(err) {
      return err.message ? `${t('loadError')} (${err.message})` : t('loadError');
    }

    function showLogin(message) {
      $('app').hidden = true;
      $('login-page').hidden = false;
      $('login-error').textContent = message || '';
      $('password').value = '';
      $('password').focus();
    }

    async function signIn() {
      const btn = $('login-btn');
      btn.disabled = true;
      btn.textContent = t('signingIn');
      try {
        await loadStats();
        savePassword(password);
        $('login-page').hidden = true;
        $('app').hidden = false;
        render();
      } catch (err) {
        savePassword('');
        showLogin(err.status === 401 ? t('wrongPassword') : errorText(err));
      } finally {
        btn.disabled = false;
        btn.textContent = t('signIn');
      }
    }

    async function refresh() {
      const btn = $('refresh');
      btn.classList.add('loading');
      $('error-banner').hidden = true;
      try {
        await loadStats();
        render();
      } catch (err) {
        if (err.status === 401) { savePassword(''); showLogin(t('sessionEnded')); return; }
        $('error-banner').textContent = errorText(err);
        $('error-banner').hidden = false;
      } finally {
        btn.classList.remove('loading');
      }
    }

    function setChannel(channel) {
      state.channel = channel;
      try { localStorage.setItem('adminChannel', channel); } catch (err) {}
      render();
    }

    // ---------- Events ----------
    $('login-form').addEventListener('submit', e => {
      e.preventDefault();
      password = $('password').value;
      signIn();
    });
    $('toggle-pw').addEventListener('click', () => {
      const input = $('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      $('toggle-pw').textContent = t(input.type === 'password' ? 'show' : 'hide');
    });
    $('logout').addEventListener('click', () => {
      password = '';
      savePassword('');
      showLogin();
    });
    $('refresh').addEventListener('click', refresh);
    document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLanguage(b.dataset.lang)));
    document.querySelectorAll('[data-channel]').forEach(el => el.addEventListener('click', e => {
      e.preventDefault();
      setChannel(el.dataset.channel);
    }));
    $('modes').addEventListener('click', e => {
      const btn = e.target.closest('button[data-mode]');
      if (!btn) return;
      state.mode = btn.dataset.mode;
      state.anchor = state.today;
      render();
    });
    $('prev').addEventListener('click', () => { state.anchor = shiftAnchor(state.mode, state.anchor, -1); render(); });
    $('next').addEventListener('click', () => { state.anchor = Math.min(shiftAnchor(state.mode, state.anchor, 1), state.today); render(); });
    $('today-btn').addEventListener('click', () => { state.anchor = state.today; render(); });
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (!$('app').hidden) render(); }, 150);
    });

    // French by default; follows the language chosen on the main website
    try { lang = localStorage.getItem('siteLanguage') === 'en' ? 'en' : 'fr'; } catch (err) {}
    applyStaticText();

    // Remember the last section viewed, and stay signed in for this browser tab
    try {
      const saved = localStorage.getItem('adminChannel');
      if (['all', 'qr', 'links'].includes(saved)) state.channel = saved;
    } catch (err) {}
    try { password = sessionStorage.getItem('adminPassword') || ''; } catch (err) {}
    if (password) {
      $('login-page').hidden = true;
      signIn();
    }
  </script>
</body>
</html>
